<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuotas y pagos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">Instituto</span>
    <a href="dashboard.html" class="btn btn-light btn-sm">Volver al panel</a>
  </nav>

  <div class="container mt-4">
    <h4 class="mb-3">Cuotas y pagos</h4>

    <div id="bloqueAlumno" class="mb-3">
      <label class="form-label">Alumno</label>
      <select id="selAlumno" class="form-select"></select>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
        <div class="text-muted small">Total abonado</div><div class="fs-4" id="totAbonado">$0</div>
      </div></div></div>
      <div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
        <div class="text-muted small">Importe adeudado</div><div class="fs-4 text-danger" id="totDeuda">$0</div>
      </div></div></div>
      <div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
        <div class="text-muted small">Cuotas vencidas</div><div class="fs-4" id="totVencidas">0</div>
      </div></div></div>
    </div>

    <h5>Cuotas</h5>
    <div class="table-responsive mb-4">
      <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
          <tr><th>N°</th><th>Vencimiento</th><th>Importe</th><th>Abonado</th><th>Saldo</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody id="tablaCuotas"></tbody>
      </table>
    </div>

    <h5>Pagos realizados</h5>
    <div class="table-responsive">
      <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
          <tr><th>Fecha</th><th>Cuota</th><th>Importe</th><th>Medio</th><th>Registrado por</th></tr>
        </thead>
        <tbody id="tablaPagos"></tbody>
      </table>
    </div>
  </div>

  <!-- Formulario de pago -->
  <div class="modal fade" id="modalPago" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formPago" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="tituloPago">Registrar pago</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="cuotaId">
            <div class="mb-2 small text-muted" id="infoSaldo"></div>
            <div class="mb-2">
              <label class="form-label">Importe a pagar</label>
              <input id="importe" type="number" step="0.01" min="0.01" class="form-control" required>
              <div class="invalid-feedback">Ingresá un importe mayor a 0.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Medio de pago</label>
              <select id="medio" class="form-select" required>
                <option value="">Seleccionar...</option>
                <option>EFECTIVO</option>
                <option>TRANSFERENCIA</option>
                <option>TARJETA</option>
                <option>OTRO</option>
              </select>
              <div class="invalid-feedback">Elegí el medio de pago.</div>
            </div>
            <div id="errorPago" class="text-danger small"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Registrar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Seguridad: todos los roles menos DOCENTE
    const sesion = JSON.parse(sessionStorage.getItem("sesion"));
    if (!sesion || sesion.rol === "DOCENTE") {
      window.location.href = "index.html";
    }
    const puedeCobrar = ["ADMINISTRADOR", "ADMINISTRATIVO"].includes(sesion.rol);

    // Datos simulados
    const alumnos = JSON.parse(localStorage.getItem("alumnos")) || [
      { id: 1, dni: "40123456", apellido: "Gómez", nombre: "Lucía",  estado: "ACTIVO" },
      { id: 2, dni: "41234567", apellido: "Pérez", nombre: "Martín", estado: "ACTIVO" },
      { id: 3, dni: "42345678", apellido: "Ruiz",  nombre: "Sofía",  estado: "ACTIVO" }
    ];

    // 4 cuotas por alumno (las 2 primeras ya vencidas)
    let cuotas = JSON.parse(localStorage.getItem("cuotas"));
    if (!cuotas) {
      cuotas = [];
      const venc = ["2026-09-10", "2026-10-10", "2026-12-10", "2027-01-10"];
      let id = 1;
      for (let a = 1; a <= 20; a++) {
        venc.forEach((v, i) => {
          cuotas.push({ id: id++, alumnoId: a, nro: i + 1, vencimiento: v, importe: 50000, anulada: false });
        });
      }
      localStorage.setItem("cuotas", JSON.stringify(cuotas));
    }
    let pagos = JSON.parse(localStorage.getItem("pagos")) || [];

    const hoy = new Date().toISOString().slice(0, 10);
    const dinero = n => "$" + n.toLocaleString("es-AR");

    // Si es ALUMNO, ve solo sus datos (en la simulación: alumno con id 1)
    const selAlumno = document.getElementById("selAlumno");
    if (!puedeCobrar) {
      document.getElementById("bloqueAlumno").style.display = "none";
    }
    alumnos.forEach(a => {
      selAlumno.innerHTML += `<option value="${a.id}">${a.apellido}, ${a.nombre} (${a.dni})</option>`;
    });

    function alumnoActual() {
      return puedeCobrar ? Number(selAlumno.value) : 1;
    }

    function abonado(cuotaId) {
      return pagos.filter(p => p.cuotaId === cuotaId).reduce((s, p) => s + p.importe, 0);
    }

    // RF31 / RN06 / RN07: el estado se calcula siempre al mostrar
    function estadoCuota(c) {
      if (c.anulada) return "ANULADA";
      if (abonado(c.id) >= c.importe) return "PAGADA";
      if (c.vencimiento < hoy) return "VENCIDA";
      return "PENDIENTE";
    }

    const colores = { PAGADA: "bg-success", VENCIDA: "bg-danger", PENDIENTE: "bg-warning text-dark", ANULADA: "bg-secondary" };

    function mostrar() {
      const idAlumno = alumnoActual();
      const misCuotas = cuotas.filter(c => c.alumnoId === idAlumno);

      let totalAbonado = 0, deuda = 0, vencidas = 0;
      const tbody = document.getElementById("tablaCuotas");
      tbody.innerHTML = "";

      misCuotas.forEach(c => {
        const est = estadoCuota(c);
        const pag = abonado(c.id);
        const saldo = c.importe - pag;
        totalAbonado += pag;
        if (est === "PENDIENTE" || est === "VENCIDA") deuda += saldo;
        if (est === "VENCIDA") vencidas++;

        const puedePagar = puedeCobrar && (est === "PENDIENTE" || est === "VENCIDA");
        tbody.innerHTML += `
          <tr>
            <td>${c.nro}</td>
            <td>${c.vencimiento}</td>
            <td>${dinero(c.importe)}</td>
            <td>${dinero(pag)}</td>
            <td>${dinero(est === "ANULADA" ? 0 : saldo)}</td>
            <td><span class="badge ${colores[est]}">${est}</span></td>
            <td class="text-end">
              ${puedePagar ? `<button class="btn btn-sm btn-outline-primary" onclick="abrirPago(${c.id})">Pagar</button>` : ""}
            </td>
          </tr>`;
      });

      document.getElementById("totAbonado").textContent = dinero(totalAbonado);
      document.getElementById("totDeuda").textContent = dinero(deuda);
      document.getElementById("totVencidas").textContent = vencidas;

      const ids = misCuotas.map(c => c.id);
      const tp = document.getElementById("tablaPagos");
      tp.innerHTML = "";
      const misPagos = pagos.filter(p => ids.includes(p.cuotaId));
      if (misPagos.length === 0) {
        tp.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Todavía no hay pagos.</td></tr>';
      }
      misPagos.forEach(p => {
        const c = cuotas.find(x => x.id === p.cuotaId);
        tp.innerHTML += `
          <tr>
            <td>${p.fecha}</td>
            <td>Cuota ${c.nro}</td>
            <td>${dinero(p.importe)}</td>
            <td>${p.medio}</td>
            <td>${p.usuario}</td>
          </tr>`;
      });
    }

    const modal = new bootstrap.Modal(document.getElementById("modalPago"));
    const form = document.getElementById("formPago");

    function abrirPago(cuotaId) {
      const c = cuotas.find(x => x.id === cuotaId);
      const saldo = c.importe - abonado(c.id);
      form.reset();
      form.classList.remove("was-validated");
      document.getElementById("errorPago").textContent = "";
      document.getElementById("cuotaId").value = cuotaId;
      document.getElementById("tituloPago").textContent = "Pagar cuota " + c.nro;
      document.getElementById("infoSaldo").textContent = "Saldo pendiente: " + dinero(saldo);
      modal.show();
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }

      const cuotaId = Number(document.getElementById("cuotaId").value);
      const c = cuotas.find(x => x.id === cuotaId);
      const importe = Number(document.getElementById("importe").value);
      const saldo = c.importe - abonado(c.id);
      const error = document.getElementById("errorPago");

      // RN15: no se paga una cuota anulada
      if (c.anulada) {
        error.textContent = "No se pueden registrar pagos sobre cuotas anuladas.";
        return;
      }

      // RN08: no superar el saldo pendiente
      if (importe > saldo) {
        error.textContent = "El importe supera el saldo pendiente (" + dinero(saldo) + ").";
        return;
      }

      // RN13: guarda quién lo cargó y el medio de pago
      const nuevoId = pagos.length ? Math.max(...pagos.map(p => p.id)) + 1 : 1;
      pagos.push({
        id: nuevoId,
        cuotaId: cuotaId,
        importe: importe,
        medio: document.getElementById("medio").value,
        usuario: sesion.usuario,
        fecha: new Date().toLocaleDateString("es-AR")
      });
      localStorage.setItem("pagos", JSON.stringify(pagos));

      modal.hide();
      mostrar();
    });

    selAlumno.addEventListener("change", mostrar);
    mostrar();
  </script>
</body>
</html>
