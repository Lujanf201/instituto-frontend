<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alumnos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">Instituto</span>
    <a href="dashboard.html" class="btn btn-light btn-sm">Volver al panel</a>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Alumnos</h4>
      <button class="btn btn-primary" onclick="abrirFormulario()">Nuevo alumno</button>
    </div>

    <input id="buscador" class="form-control mb-3" placeholder="Buscar por DNI, apellido o nombre">

    <div class="table-responsive">
      <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
          <tr>
            <th>DNI</th><th>Apellido</th><th>Nombre</th><th>Email</th><th>Estado</th><th></th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
  </div>

  <!-- Formulario -->
  <div class="modal fade" id="modalAlumno" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formAlumno" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModal">Nuevo alumno</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="idAlumno">
            <div class="mb-2">
              <label class="form-label">DNI</label>
              <input id="dni" class="form-control" required pattern="[0-9]{7,8}">
              <div class="invalid-feedback">DNI de 7 u 8 números.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Apellido</label>
              <input id="apellido" class="form-control" required minlength="2">
              <div class="invalid-feedback">Ingresá el apellido.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Nombre</label>
              <input id="nombre" class="form-control" required minlength="2">
              <div class="invalid-feedback">Ingresá el nombre.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input id="email" type="email" class="form-control" required>
              <div class="invalid-feedback">Email no válido.</div>
            </div>
            <div id="errorForm" class="text-danger small"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Seguridad: solo ADMINISTRADOR y ADMINISTRATIVO
    const sesion = JSON.parse(sessionStorage.getItem("sesion"));
    if (!sesion || !["ADMINISTRADOR", "ADMINISTRATIVO"].includes(sesion.rol)) {
      window.location.href = "index.html";
    }

    // Datos simulados (se guardan en el navegador)
    let alumnos = JSON.parse(localStorage.getItem("alumnos")) || [
      { id: 1, dni: "40123456", apellido: "Gómez",  nombre: "Lucía",  email: "lucia@mail.com",  estado: "ACTIVO" },
      { id: 2, dni: "41234567", apellido: "Pérez",  nombre: "Martín", email: "martin@mail.com", estado: "ACTIVO" },
      { id: 3, dni: "42345678", apellido: "Ruiz",   nombre: "Sofía",  email: "sofia@mail.com",  estado: "ACTIVO" }
    ];

    function guardar() {
      localStorage.setItem("alumnos", JSON.stringify(alumnos));
    }

    function mostrar() {
      const texto = document.getElementById("buscador").value.toLowerCase().trim();
      const filtrados = alumnos.filter(a =>
        a.dni.includes(texto) ||
        a.apellido.toLowerCase().includes(texto) ||
        a.nombre.toLowerCase().includes(texto)
      );

      const tbody = document.getElementById("tabla");
      tbody.innerHTML = "";
      filtrados.forEach(a => {
        tbody.innerHTML += `
          <tr>
            <td>${a.dni}</td>
            <td>${a.apellido}</td>
            <td>${a.nombre}</td>
            <td>${a.email}</td>
            <td><span class="badge ${a.estado === "ACTIVO" ? "bg-success" : "bg-secondary"}">${a.estado}</span></td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary" onclick="editar(${a.id})">Editar</button>
              <button class="btn btn-sm btn-outline-danger" onclick="darDeBaja(${a.id})">Baja</button>
            </td>
          </tr>`;
      });
    }

    const modal = new bootstrap.Modal(document.getElementById("modalAlumno"));
    const form = document.getElementById("formAlumno");

    function abrirFormulario() {
      form.reset();
      form.classList.remove("was-validated");
      document.getElementById("errorForm").textContent = "";
      document.getElementById("idAlumno").value = "";
      document.getElementById("tituloModal").textContent = "Nuevo alumno";
      modal.show();
    }

    function editar(id) {
      const a = alumnos.find(x => x.id === id);
      abrirFormulario();
      document.getElementById("tituloModal").textContent = "Editar alumno";
      document.getElementById("idAlumno").value = a.id;
      document.getElementById("dni").value = a.dni;
      document.getElementById("apellido").value = a.apellido;
      document.getElementById("nombre").value = a.nombre;
      document.getElementById("email").value = a.email;
    }

    function darDeBaja(id) {
      if (!confirm("¿Dar de baja a este alumno?")) return;
      const a = alumnos.find(x => x.id === id);
      a.estado = "INACTIVO"; // baja lógica (RN12)
      guardar();
      mostrar();
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }

      const id = document.getElementById("idAlumno").value;
      const dni = document.getElementById("dni").value.trim();

      // RN14: DNI único
      const duplicado = alumnos.some(a => a.dni === dni && String(a.id) !== id);
      if (duplicado) {
        document.getElementById("errorForm").textContent = "Ya existe un alumno con ese DNI.";
        return;
      }

      const datos = {
        dni: dni,
        apellido: document.getElementById("apellido").value.trim(),
        nombre: document.getElementById("nombre").value.trim(),
        email: document.getElementById("email").value.trim()
      };

      if (id) {
        Object.assign(alumnos.find(a => String(a.id) === id), datos);
      } else {
        const nuevoId = alumnos.length ? Math.max(...alumnos.map(a => a.id)) + 1 : 1;
        alumnos.push({ id: nuevoId, estado: "ACTIVO", ...datos });
      }

      guardar();
      mostrar();
      modal.hide();
    });

    document.getElementById("buscador").addEventListener("input", mostrar);
    mostrar();
  </script>
</body>
</html>
