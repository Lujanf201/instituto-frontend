<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscripción</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">Instituto</span>
    <a href="dashboard.html" class="btn btn-light btn-sm">Volver al panel</a>
  </nav>

  <div class="container mt-4">
    <h4 class="mb-3">Inscripción a cursos</h4>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form id="formInscripcion" novalidate>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Alumno</label>
              <select id="selAlumno" class="form-select" required></select>
              <div class="invalid-feedback">Elegí un alumno.</div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Ciclo lectivo</label>
              <select id="selCiclo" class="form-select" required></select>
              <div class="invalid-feedback">Elegí un ciclo.</div>
            </div>
            <div class="col-md-5">
              <label class="form-label">Curso</label>
              <select id="selCurso" class="form-select" required></select>
              <div class="invalid-feedback">Elegí un curso.</div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary mt-3">Inscribir</button>
        </form>
        <div id="mensaje" class="mt-3"></div>
      </div>
    </div>

    <h5>Cupos por curso</h5>
    <div class="table-responsive mb-4">
      <table class="table bg-white shadow-sm">
        <thead class="table-dark">
          <tr><th>Curso</th><th>Ciclo</th><th>Inscriptos</th><th>Capacidad</th><th>Estado</th></tr>
        </thead>
        <tbody id="tablaCupos"></tbody>
      </table>
    </div>

    <h5>Inscripciones registradas</h5>
    <div class="table-responsive">
      <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
          <tr><th>Alumno</th><th>DNI</th><th>Curso</th><th>Ciclo</th><th>Fecha</th></tr>
        </thead>
        <tbody id="tablaInscripciones"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Seguridad: solo ADMINISTRADOR y ADMINISTRATIVO
    const sesion = JSON.parse(sessionStorage.getItem("sesion"));
    if (!sesion || !["ADMINISTRADOR", "ADMINISTRATIVO"].includes(sesion.rol)) {
      window.location.href = "index.html";
    }

    // Datos simulados
    const alumnos = JSON.parse(localStorage.getItem("alumnos")) || [
      { id: 1, dni: "40123456", apellido: "Gómez", nombre: "Lucía",  email: "lucia@mail.com",  estado: "ACTIVO" },
      { id: 2, dni: "41234567", apellido: "Pérez", nombre: "Martín", email: "martin@mail.com", estado: "ACTIVO" },
      { id: 3, dni: "42345678", apellido: "Ruiz",  nombre: "Sofía",  email: "sofia@mail.com",  estado: "ACTIVO" }
    ];

    const ciclos = [
      { id: 1, anio: 2026 },
      { id: 2, anio: 2027 }
    ];

    // Capacidades chicas a propósito para probar el error de cupo
    const cursos = [
      { id: 1, nombre: "Inglés A1",    cicloId: 1, capacidad: 2 },
      { id: 2, nombre: "Programación", cicloId: 1, capacidad: 3 },
      { id: 3, nombre: "Inglés A2",    cicloId: 2, capacidad: 2 }
    ];

    let inscripciones = JSON.parse(localStorage.getItem("inscripciones")) || [];

    const selAlumno = document.getElementById("selAlumno");
    const selCiclo = document.getElementById("selCiclo");
    const selCurso = document.getElementById("selCurso");
    const form = document.getElementById("formInscripcion");

    function mensaje(texto, tipo) {
      document.getElementById("mensaje").innerHTML =
        `<div class="alert alert-${tipo} mb-0">${texto}</div>`;
    }

    function cargarSelects() {
      selAlumno.innerHTML = '<option value="">Seleccionar...</option>';
      alumnos.filter(a => a.estado === "ACTIVO").forEach(a => {
        selAlumno.innerHTML += `<option value="${a.id}">${a.apellido}, ${a.nombre} (${a.dni})</option>`;
      });

      selCiclo.innerHTML = '<option value="">Seleccionar...</option>';
      ciclos.forEach(c => {
        selCiclo.innerHTML += `<option value="${c.id}">${c.anio}</option>`;
      });

      cargarCursos();
    }

    function cargarCursos() {
      const cicloId = Number(selCiclo.value);
      selCurso.innerHTML = '<option value="">Seleccionar...</option>';
      cursos.filter(c => c.cicloId === cicloId).forEach(c => {
        selCurso.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
      });
    }

    function inscriptosEn(cursoId) {
      return inscripciones.filter(i => i.cursoId === cursoId).length;
    }

    function mostrarTablas() {
      // Cupos
      const tc = document.getElementById("tablaCupos");
      tc.innerHTML = "";
      cursos.forEach(c => {
        const n = inscriptosEn(c.id);
        const lleno = n >= c.capacidad;
        const ciclo = ciclos.find(x => x.id === c.cicloId);
        tc.innerHTML += `
          <tr>
            <td>${c.nombre}</td>
            <td>${ciclo.anio}</td>
            <td>${n}</td>
            <td>${c.capacidad}</td>
            <td><span class="badge ${lleno ? "bg-danger" : "bg-success"}">${lleno ? "COMPLETO" : "CON CUPO"}</span></td>
          </tr>`;
      });

      // Inscripciones
      const ti = document.getElementById("tablaInscripciones");
      ti.innerHTML = "";
      if (inscripciones.length === 0) {
        ti.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Todavía no hay inscripciones.</td></tr>';
        return;
      }
      inscripciones.forEach(i => {
        const a = alumnos.find(x => x.id === i.alumnoId);
        const c = cursos.find(x => x.id === i.cursoId);
        const ciclo = ciclos.find(x => x.id === i.cicloId);
        ti.innerHTML += `
          <tr>
            <td>${a.apellido}, ${a.nombre}</td>
            <td>${a.dni}</td>
            <td>${c.nombre}</td>
            <td>${ciclo.anio}</td>
            <td>${i.fecha}</td>
          </tr>`;
      });
    }

    selCiclo.addEventListener("change", cargarCursos);

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("mensaje").innerHTML = "";

      // RN03: tienen que existir alumno, ciclo y curso
      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }

      const alumnoId = Number(selAlumno.value);
      const cicloId = Number(selCiclo.value);
      const cursoId = Number(selCurso.value);
      const curso = cursos.find(c => c.id === cursoId);

      // RN01: sin inscripciones duplicadas
      const duplicada = inscripciones.some(i =>
        i.alumnoId === alumnoId && i.cursoId === cursoId && i.cicloId === cicloId
      );
      if (duplicada) {
        mensaje("Ese alumno ya está inscripto en este curso para ese ciclo.", "danger");
        return;
      }

      // RN02: no superar la capacidad
      if (inscriptosEn(cursoId) >= curso.capacidad) {
        mensaje("El curso no tiene cupos disponibles.", "danger");
        return;
      }

      const nuevoId = inscripciones.length ? Math.max(...inscripciones.map(i => i.id)) + 1 : 1;
      inscripciones.push({
        id: nuevoId,
        alumnoId: alumnoId,
        cursoId: cursoId,
        cicloId: cicloId,
        fecha: new Date().toLocaleDateString("es-AR")
      });
      localStorage.setItem("inscripciones", JSON.stringify(inscripciones));

      mensaje("Inscripción registrada correctamente.", "success");
      form.classList.remove("was-validated");
      form.reset();
      cargarCursos();
      mostrarTablas();
    });

    cargarSelects();
    mostrarTablas();
  </script>
</body>
</html>
